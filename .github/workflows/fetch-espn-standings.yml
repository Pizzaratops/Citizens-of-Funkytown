name: Saison-Standings abrufen

# Holt die Abschlusstabelle (wer wurde 1., 2., 3. usw.) für eine oder
# mehrere abgeschlossene ESPN-Saisons (siehe scripts/fetch-espn-standings.js).
# Rein manuell -- eine abgeschlossene Saison ändert sich nicht mehr, es
# gibt also keinen Grund für einen täglichen Zeitplan.
#
# Läuft im Actions-Tab unter "Saison-Standings abrufen" -> "Run workflow".
# Entweder eine einzelne ESPN-Saison angeben (z.B. 2022 = Saison 2021/22),
# oder einen Von/Bis-Bereich, oder alles leer lassen für den Standard-Lauf
# (alle abgeschlossenen Saisons ab 2019).

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Einzelne ESPN-Saison (z.B. 2022 für Saison 2021/22). Leer lassen für Bereich/Standard."
        required: false
        default: ""
      from:
        description: "Bereich: erste ESPN-Saison (nur zusammen mit 'to' nutzen)"
        required: false
        default: ""
      to:
        description: "Bereich: letzte ESPN-Saison (nur zusammen mit 'from' nutzen)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Standings abrufen
        run: |
          if [ -n "${{ github.event.inputs.season }}" ]; then
            node scripts/fetch-espn-standings.js --season "${{ github.event.inputs.season }}"
          elif [ -n "${{ github.event.inputs.from }}" ] && [ -n "${{ github.event.inputs.to }}" ]; then
            node scripts/fetch-espn-standings.js --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}"
          else
            node scripts/fetch-espn-standings.js
          fi

      - name: Änderungen committen & pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season-*.js
          if git diff --staged --quiet; then
            echo "Keine Änderung, nichts zu committen."
          else
            git commit -m "Saison-Standings abgerufen ($(date -u +%Y-%m-%d))"
            git push
          fi
